name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node 22 is the minimum for `--experimental-test-isolation=none`
      # and glob patterns in `node --test`; the plugin itself runs on Node 20+.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
